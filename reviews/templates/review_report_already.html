{% extends "base.html" %}

{% block title %}Already Reported{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body">

          <h2 class="h4 mb-3 text-center">Already reported</h2>

          <div class="alert alert-info mb-3">
            You already reported this review.
          </div>

          <div class="mb-3">
            <span class="text-muted">Review text:</span>
            <blockquote class="blockquote mt-2 mb-0">
              <p class="mb-0">“{{ review.text }}”</p>
            </blockquote>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{% url 'product_detail' review.product.id %}" class="btn btn-outline-secondary">
              ← Back to product
            </a>
            <a href="{% url 'home' %}" class="btn btn-primary">
              Home
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
{% endblock %}
