{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Review{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">

          <h2 class="h4 mb-4 text-center">
            {% if is_edit %}
              Edit Your Review
            {% else %}
              Write Your Review
            {% endif %}
          </h2>

          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-primary w-100">
              {% if is_edit %}
                Save Changes
              {% else %}
                Submit Review
              {% endif %}
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
{% endblock %}
